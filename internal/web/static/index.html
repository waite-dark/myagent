<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyClaw AI</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --primary: #6c63ff;
    --primary-light: #8b83ff;
    --text: #e0e0e0;
    --text-dim: #888;
    --user-bg: #2a2a4a;
    --assistant-bg: #1e1e3a;
    --tool-bg: #1a2a1a;
    --error-bg: #3a1a1a;
    --border: #333;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--surface);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    background: linear-gradient(135deg, var(--primary), #e040fb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .status {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s;
  }
  .status-dot.connected { background: #4caf50; }
  .header-actions { display: flex; gap: 8px; }
  .btn-clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .btn-clear:hover { border-color: var(--primary); color: var(--primary); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .msg {
    max-width: 85%;
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bg);
    border: 1px solid #3a3a6a;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-bg);
    border: 1px solid #2e2e5e;
  }
  .msg.tool {
    align-self: flex-start;
    background: var(--tool-bg);
    border: 1px solid #2a4a2a;
    font-size: 13px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }
  .msg.error {
    align-self: flex-start;
    background: var(--error-bg);
    border: 1px solid #5a2a2a;
    color: #ff6b6b;
  }
  .msg .label {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    display: block;
  }
  .msg.user .label { color: var(--primary-light); }
  .msg.assistant .label { color: #4caf50; }
  .msg.tool .label { color: #ffa726; }
  .msg.error .label { color: #ff6b6b; }

  .thinking {
    align-self: flex-start;
    padding: 12px 16px;
    color: var(--text-dim);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot-pulse { display: flex; gap: 4px; }
  .dot-pulse span {
    width: 6px; height: 6px;
    background: var(--primary);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1.2); } }

  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    flex-shrink: 0;
  }
  #input {
    flex: 1;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    transition: border-color 0.2s;
  }
  #input:focus { border-color: var(--primary); }
  #input::placeholder { color: #555; }
  #sendBtn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  #sendBtn:hover { background: var(--primary-light); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <header>
    <h1>🤖 MyClaw AI</h1>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">未连接</span>
    </div>
    <div class="header-actions">
      <button class="btn-clear" onclick="clearChat()">清空对话</button>
    </div>
  </header>
  <div id="chat"></div>
  <div class="input-area">
    <textarea id="input" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
<script>
(function() {
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  let ws = null;
  let thinking = null;
  let busy = false;

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + '/ws');

    ws.onopen = () => {
      statusDot.classList.add('connected');
      statusText.textContent = '已连接';
    };

    ws.onclose = () => {
      statusDot.classList.remove('connected');
      statusText.textContent = '已断开';
      busy = false;
      sendBtn.disabled = false;
      removeThinking();
      setTimeout(connect, 2000);
    };

    ws.onerror = () => {
      statusDot.classList.remove('connected');
      statusText.textContent = '连接错误';
    };

    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      handleEvent(msg);
    };
  }

  function handleEvent(ev) {
    switch (ev.type) {
      case 'thinking':
        showThinking();
        break;
      case 'tool_call':
        removeThinking();
        addMessage('tool', '🔧 调用工具: ' + ev.name + '\n参数: ' + ev.args);
        showThinking();
        break;
      case 'tool_result':
        removeThinking();
        addMessage('tool', '📋 ' + ev.name + ' 返回:\n' + ev.result);
        showThinking();
        break;
      case 'assistant':
        removeThinking();
        addMessage('assistant', ev.content);
        busy = false;
        sendBtn.disabled = false;
        input.focus();
        break;
      case 'error':
        removeThinking();
        addMessage('error', ev.content);
        busy = false;
        sendBtn.disabled = false;
        input.focus();
        break;
    }
  }

  function addMessage(type, text) {
    const labels = { user: 'You', assistant: 'AI', tool: 'Tool', error: 'Error' };
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = labels[type] || type;
    const body = document.createElement('span');
    body.textContent = text;
    div.appendChild(label);
    div.appendChild(body);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function showThinking() {
    if (thinking) return;
    thinking = document.createElement('div');
    thinking.className = 'thinking';
    thinking.innerHTML = '<div class="dot-pulse"><span></span><span></span><span></span></div> 思考中...';
    chat.appendChild(thinking);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeThinking() {
    if (thinking) { thinking.remove(); thinking = null; }
  }

  window.send = function() {
    const text = input.value.trim();
    if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMessage('user', text);
    ws.send(JSON.stringify({ type: 'message', content: text }));
    input.value = '';
    input.style.height = 'auto';
    busy = true;
    sendBtn.disabled = true;
  };

  window.clearChat = function() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'clear' }));
    chat.innerHTML = '';
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      window.send();
    }
  });

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  connect();
})();
</script>
</body>
</html>
