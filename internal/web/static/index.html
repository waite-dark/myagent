<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyClaw AI</title>
<!-- marked.js for Markdown rendering -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<!-- highlight.js for code syntax highlighting -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/atom-one-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/languages/go.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/languages/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/languages/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/languages/sql.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/languages/yaml.min.js"></script>
<style>
  :root {
    --bg: #0a0a12;
    --surface: #12122a;
    --surface2: #1a1a3e;
    --surface3: #222250;
    --primary: #7c6aff;
    --primary-light: #9d8fff;
    --primary-dim: rgba(124,106,255,0.15);
    --accent: #e040fb;
    --text: #e8e8f0;
    --text-dim: #9a7a84;
    --text-muted: #555570;
    --user-bg: linear-gradient(135deg, #2a2a5a, #1e1e48);
    --assistant-bg: linear-gradient(135deg, #161636, #1a1a3a);
    --tool-bg: linear-gradient(135deg, #122218, #0e1e14);
    --error-bg: linear-gradient(135deg, #2e1218, #261018);
    --border: rgba(255,255,255,0.08);
    --border-light: rgba(255,255,255,0.12);
    --glow: 0 0 20px rgba(124,106,255,0.15);
    --radius: 14px;
    --radius-sm: 10px;
    --sidebar-w: 290px;
    --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* ===== Scrollbar ===== */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

  /* ===== 侧边栏 ===== */
  .sidebar {
    width: var(--sidebar-w);
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  .sidebar-brand {
    padding: 20px 18px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .sidebar-brand .logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    box-shadow: var(--glow);
  }
  .sidebar-brand .brand-text {
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--primary-light), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .sidebar-header {
    padding: 8px 12px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .sidebar-header h2 {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .btn-icon {
    background: var(--primary-dim);
    border: 1px solid rgba(124,106,255,0.2);
    color: var(--primary-light);
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }
  .btn-icon:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: var(--glow);
    transform: scale(1.05);
  }

  .agent-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 10px 10px;
  }

  .agent-item {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    transition: all var(--transition);
    border: 1px solid transparent;
    position: relative;
  }
  .agent-item:hover {
    background: var(--surface2);
    border-color: var(--border-light);
  }
  .agent-item.active {
    background: linear-gradient(135deg, rgba(124,106,255,0.2), rgba(224,64,251,0.1));
    border-color: rgba(124,106,255,0.3);
    box-shadow: var(--glow);
  }
  .agent-item .agent-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: var(--surface3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    margin-right: 12px;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }
  .agent-item.active .agent-icon {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-color: transparent;
  }
  .agent-item .agent-name {
    font-size: 14px;
    font-weight: 500;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .agent-item .agent-model {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .agent-item.active .agent-name { color: #fff; }
  .agent-item.active .agent-model { color: rgba(255,255,255,0.6); }
  .agent-item-info { flex: 1; min-width: 0; }
  .agent-item-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; }
  .agent-item:hover .agent-item-actions { opacity: 1; }
  .agent-item.active .agent-item-actions { opacity: 1; }
  .btn-sm {
    background: transparent;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 4px 6px;
    border-radius: 6px;
    transition: all var(--transition);
  }
  .btn-sm:hover { color: var(--primary-light); background: rgba(255,255,255,0.08); }
  .agent-item.active .btn-sm { color: rgba(255,255,255,0.6); }
  .agent-item.active .btn-sm:hover { color: #fff; background: rgba(255,255,255,0.15); }

  .empty-hint {
    text-align: center;
    color: var(--text-dim);
    padding: 48px 20px;
    font-size: 13px;
    line-height: 2;
  }
  .empty-hint .empty-icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.5;
  }

  .sidebar-footer {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
  }

  /* ===== 主区域 ===== */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--bg);
  }

  header {
    background: rgba(18,18,42,0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 5;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  header h1 {
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .status {
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.04);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #555;
    transition: all 0.3s;
  }
  .status-dot.connected {
    background: #4caf50;
    box-shadow: 0 0 8px rgba(76,175,80,0.5);
  }
  .header-actions { display: flex; gap: 8px; }
  .btn-clear {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 7px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-clear:hover {
    border-color: rgba(255,100,100,0.4);
    color: #ff6b6b;
    background: rgba(255,100,100,0.08);
  }

  /* 未选择 Agent 的占位 */
  .no-agent {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 15px;
    gap: 16px;
  }
  .no-agent .no-agent-icon {
    font-size: 56px;
    opacity: 0.4;
  }
  .no-agent .no-agent-text {
    font-size: 15px;
    color: var(--text-dim);
  }
  .no-agent .no-agent-hint {
    font-size: 13px;
    color: var(--text-muted);
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ===== 消息气泡 ===== */
  .msg-wrapper {
    display: flex;
    gap: 12px;
    padding: 8px 28px;
    animation: msgIn 0.3s cubic-bezier(0.4,0,0.2,1);
    max-width: 100%;
  }
  .msg-wrapper.user { justify-content: flex-end; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .msg-wrapper.user .msg-avatar {
    background: linear-gradient(135deg, var(--primary), #5a4be0);
    order: 2;
  }
  .msg-wrapper.assistant .msg-avatar {
    background: linear-gradient(135deg, #1e8a4e, #15703e);
  }
  .msg-wrapper.error .msg-avatar {
    background: linear-gradient(135deg, #cc3333, #991a1a);
  }

  .msg-content {
    max-width: 75%;
    min-width: 60px;
  }
  .msg-wrapper.user .msg-content { text-align: right; }

  .msg-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 5px;
  }
  .msg-wrapper.user .msg-header { justify-content: flex-end; }
  .msg-name {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .msg-time {
    font-size: 11px;
    color: var(--text-muted);
  }

  .msg-bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.7;
    font-size: 14px;
    word-break: break-word;
    position: relative;
  }
  .msg-wrapper.user .msg-bubble {
    background: var(--user-bg);
    border: 1px solid rgba(124,106,255,0.2);
    border-radius: var(--radius) var(--radius) 4px var(--radius);
    white-space: pre-wrap;
  }
  .msg-wrapper.assistant .msg-bubble {
    background: var(--assistant-bg);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
  }
  .msg-wrapper.error .msg-bubble {
    background: var(--error-bg);
    border: 1px solid rgba(255,80,80,0.2);
    border-radius: var(--radius) var(--radius) var(--radius) 4px;
    color: #ff8a8a;
  }

  /* Markdown 渲染样式 */
  .msg-bubble.md-rendered {
    white-space: normal;
  }
  .msg-bubble.md-rendered p { margin: 0 0 8px 0; }
  .msg-bubble.md-rendered p:last-child { margin-bottom: 0; }
  .msg-bubble.md-rendered ul, .msg-bubble.md-rendered ol { padding-left: 20px; margin: 8px 0; }
  .msg-bubble.md-rendered li { margin: 4px 0; }
  .msg-bubble.md-rendered strong { color: #fff; }
  .msg-bubble.md-rendered em { color: var(--primary-light); }
  .msg-bubble.md-rendered a { color: var(--primary-light); text-decoration: none; }
  .msg-bubble.md-rendered a:hover { text-decoration: underline; }
  .msg-bubble.md-rendered blockquote {
    border-left: 3px solid var(--primary);
    padding: 4px 12px;
    margin: 8px 0;
    color: var(--text-dim);
    background: rgba(255,255,255,0.03);
    border-radius: 0 6px 6px 0;
  }
  .msg-bubble.md-rendered h1, .msg-bubble.md-rendered h2,
  .msg-bubble.md-rendered h3, .msg-bubble.md-rendered h4 {
    margin: 12px 0 6px;
    color: #fff;
  }
  .msg-bubble.md-rendered h1 { font-size: 18px; }
  .msg-bubble.md-rendered h2 { font-size: 16px; }
  .msg-bubble.md-rendered h3 { font-size: 15px; }
  .msg-bubble.md-rendered table { border-collapse: collapse; margin: 8px 0; width: 100%; }
  .msg-bubble.md-rendered th, .msg-bubble.md-rendered td {
    border: 1px solid var(--border-light);
    padding: 6px 10px;
    text-align: left;
    font-size: 13px;
  }
  .msg-bubble.md-rendered th { background: rgba(255,255,255,0.05); color: #fff; font-weight: 600; }

  /* 内联代码 */
  .msg-bubble.md-rendered code:not(pre code) {
    background: rgba(124,106,255,0.15);
    color: var(--primary-light);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 0.9em;
  }

  /* 代码块 */
  .code-block-wrapper {
    position: relative;
    margin: 10px 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border-light);
  }
  .code-block-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: rgba(255,255,255,0.05);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
  }
  .code-block-lang {
    font-family: 'Cascadia Code', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .code-copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 3px 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 11px;
    transition: all var(--transition);
  }
  .code-copy-btn:hover { border-color: var(--primary); color: var(--primary); }
  .code-copy-btn.copied { border-color: #4caf50; color: #4caf50; }
  .code-block-wrapper pre {
    margin: 0 !important;
    border-radius: 0 !important;
    border: none !important;
  }
  .msg-bubble.md-rendered pre {
    margin: 0;
    padding: 0;
    background: transparent;
  }
  .msg-bubble.md-rendered pre code {
    display: block;
    padding: 14px 16px;
    background: rgba(0,0,0,0.4);
    font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
    overflow-x: auto;
    color: var(--text);
  }

  /* ===== 工具调用卡片 ===== */
  .tool-card {
    margin: 4px 28px;
    animation: msgIn 0.3s cubic-bezier(0.4,0,0.2,1);
  }
  .tool-detail {
    border: 1px solid rgba(255,167,38,0.15);
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: rgba(255,167,38,0.04);
  }
  .tool-detail summary {
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 8px;
    list-style: none;
    transition: all var(--transition);
    user-select: none;
  }
  .tool-detail summary::-webkit-details-marker { display: none; }
  .tool-detail summary:hover { background: rgba(255,167,38,0.06); }
  .tool-detail summary .tool-icon { font-size: 15px; }
  .tool-detail summary .tool-name { font-weight: 600; color: #ffa726; font-size: 13px; }
  .tool-detail summary .tool-arrow {
    margin-left: auto;
    transition: transform 0.2s;
    color: var(--text-muted);
    font-size: 12px;
  }
  .tool-detail[open] summary .tool-arrow { transform: rotate(90deg); }
  .tool-detail-body {
    padding: 10px 14px;
    border-top: 1px solid rgba(255,167,38,0.1);
    font-size: 12px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
    background: rgba(0,0,0,0.15);
    line-height: 1.6;
  }

  /* ===== 思考动画 ===== */
  .thinking {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 28px;
    animation: msgIn 0.3s ease;
  }
  .thinking-avatar {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, #1e8a4e, #15703e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  .thinking-content {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-dim);
    font-size: 13px;
  }
  .dot-pulse { display: flex; gap: 5px; }
  .dot-pulse span {
    width: 7px; height: 7px;
    background: var(--primary);
    border-radius: 50%;
    animation: pulse 1.4s ease-in-out infinite;
  }
  .dot-pulse span:nth-child(2) { animation-delay: 0.2s; }
  .dot-pulse span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.7); }
    40% { opacity: 1; transform: scale(1.1); }
  }

  /* ===== 输入区域 ===== */
  .input-area {
    background: rgba(18,18,42,0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    padding: 16px 28px;
    flex-shrink: 0;
  }
  .input-container {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border-light);
    border-radius: 14px;
    padding: 6px 6px 6px 18px;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .input-container:focus-within {
    border-color: rgba(124,106,255,0.4);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.08);
  }
  #input {
    flex: 1;
    background: transparent;
    color: var(--text);
    border: none;
    padding: 8px 0;
    font-size: 14px;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 24px;
    max-height: 120px;
    line-height: 1.5;
  }
  #input::placeholder { color: var(--text-muted); }
  #sendBtn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    width: 40px; height: 40px;
    font-size: 16px;
    cursor: pointer;
    transition: all var(--transition);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #sendBtn:hover {
    background: var(--primary-light);
    box-shadow: var(--glow);
    transform: scale(1.05);
  }
  #sendBtn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }
  .input-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 8px;
    text-align: center;
  }

  /* ===== 模态框 ===== */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 20px;
    padding: 28px;
    width: 500px;
    max-width: 92vw;
    max-height: 90vh;
    overflow-y: auto;
    animation: modalIn 0.25s cubic-bezier(0.4,0,0.2,1);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(10px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal h3 {
    font-size: 18px;
    margin-bottom: 24px;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal h3 .modal-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--primary-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 7px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  .form-group input,
  .form-group textarea,
  .form-group select {
    width: 100%;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: all var(--transition);
  }
  .form-group input:focus,
  .form-group textarea:focus,
  .form-group select:focus {
    border-color: rgba(124,106,255,0.5);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.1);
  }
  .form-group input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .form-group textarea { min-height: 90px; resize: vertical; line-height: 1.5; }
  .form-group select[multiple] { min-height: 100px; }
  .form-group select option { padding: 6px 10px; }
  .form-group .hint { font-size: 11px; color: var(--text-muted); margin-top: 5px; }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .btn {
    padding: 9px 22px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    cursor: pointer;
    border: none;
    transition: all var(--transition);
    font-weight: 500;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-light); box-shadow: var(--glow); }
  .btn-secondary {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-light);
    color: var(--text-dim);
  }
  .btn-secondary:hover { border-color: var(--text-dim); color: var(--text); background: rgba(255,255,255,0.08); }
  .btn-danger { background: rgba(204,51,51,0.15); color: #ff6b6b; border: 1px solid rgba(204,51,51,0.3); }
  .btn-danger:hover { background: #cc3333; color: #fff; border-color: #cc3333; }

  /* ===== 移动端适配 ===== */
  .sidebar-toggle {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }
  .sidebar-toggle:hover { border-color: var(--primary); color: var(--primary); }

  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      z-index: 50;
      box-shadow: 4px 0 20px rgba(0,0,0,0.4);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-toggle { display: flex; }
    .sidebar-backdrop {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 40;
    }
    .sidebar-backdrop.open { display: block; }
    .msg-content { max-width: 88%; }
    .msg-wrapper { padding: 6px 16px; }
    header { padding: 12px 16px; }
    .input-area { padding: 12px 16px; }
    #chat { padding: 16px 0; }
  }
</style>
</head>
<body>

  <!-- 移动端遮罩 -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

  <!-- 侧边栏 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">⚡</div>
      <span class="brand-text">MyClaw AI</span>
    </div>
    <div class="sidebar-header">
      <h2>Agents</h2>
      <button class="btn-icon" onclick="openCreateModal()" title="新建 Agent">+</button>
    </div>
    <div class="agent-list" id="agentList">
      <div class="empty-hint">
        <div class="empty-icon">🤖</div>
        暂无 Agent<br>点击上方 + 创建一个
      </div>
    </div>
    <div class="sidebar-footer">MyClaw AI Agent Framework</div>
  </div>

  <!-- 主区域 -->
  <div class="main">
    <header>
      <div class="header-left">
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>
        <h1 id="headerTitle">MyClaw AI</h1>
        <div class="status">
          <div class="status-dot" id="statusDot"></div>
          <span id="statusText">未连接</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-clear" onclick="clearChat()">🗑 清空对话</button>
      </div>
    </header>
    <div class="no-agent" id="noAgent">
      <div class="no-agent-icon">💬</div>
      <div class="no-agent-text">选择一个 Agent 开始对话</div>
      <div class="no-agent-hint">在左侧面板选择已有的 Agent，或创建一个新的</div>
    </div>
    <div id="chat" style="display:none;"></div>
    <div class="input-area" id="inputArea" style="display:none;">
      <div class="input-container">
        <textarea id="input" placeholder="输入消息..." rows="1"></textarea>
        <button id="sendBtn" onclick="send()">↑</button>
      </div>
      <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
    </div>
  </div>

  <!-- 创建/编辑 Agent 模态框 -->
  <div class="modal-overlay" id="agentModal">
    <div class="modal">
      <h3><span class="modal-icon" id="modalIcon">🤖</span> <span id="modalTitle">新建 Agent</span></h3>
      <div class="form-group">
        <label>Agent ID</label>
        <input id="fId" placeholder="唯一标识，如 coder、translator" />
        <div class="hint">创建后不可更改</div>
      </div>
      <div class="form-group">
        <label>名称</label>
        <input id="fName" placeholder="显示名称" />
      </div>
      <div class="form-group">
        <label>模型</label>
        <input id="fModel" placeholder="如 deepseek-chat、gpt-4o（留空使用默认）" />
      </div>
      <div class="form-group">
        <label>System Prompt</label>
        <textarea id="fPrompt" placeholder="设定 Agent 的角色和行为..."></textarea>
      </div>
      <div class="form-group">
        <label>最大工具调用轮次</label>
        <input id="fMaxTurns" type="number" value="10" min="1" max="50" />
      </div>
      <div class="form-group">
        <label>启用的工具</label>
        <select id="fTools" multiple></select>
        <div class="hint">按住 Ctrl 多选，不选则使用全部工具</div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeModal()">取消</button>
        <button class="btn btn-danger" id="btnDelete" style="display:none;" onclick="deleteAgent()">删除</button>
        <button class="btn btn-primary" id="btnSave" onclick="saveAgent()">创建</button>
      </div>
    </div>
  </div>

<script>
(function() {
  // 自动检测 basePath：去掉末尾的 /
  const BASE_PATH = location.pathname.replace(/\/+$/, '') || '';

  const $ = id => document.getElementById(id);
  const chat = $('chat');
  const input = $('input');
  const sendBtn = $('sendBtn');
  const statusDot = $('statusDot');
  const statusText = $('statusText');
  const agentList = $('agentList');
  const headerTitle = $('headerTitle');
  const noAgent = $('noAgent');
  const inputArea = $('inputArea');

  let ws = null;
  let thinking = null;
  let busy = false;
  let currentAgentId = null;
  let agents = [];
  let allTools = [];
  let editingId = null;
  let streamingBubble = null; // 流式输出的气泡元素
  let streamContent = '';     // 流式输出累积内容

  let reconnectTimer = null;
  let reconnectAttempt = 0;
  let intentionalClose = false;
  // ===== Markdown 配置 =====
  if (typeof marked !== 'undefined') {
    const renderer = new marked.Renderer();
    // 代码块：带语言标签和复制按钮
    renderer.code = function(obj) {
      const text = obj.text || '';
      const lang = obj.lang || '';
      let highlighted = text;
      if (typeof hljs !== 'undefined' && lang && hljs.getLanguage(lang)) {
        try { highlighted = hljs.highlight(text, { language: lang }).value; } catch {}
      } else if (typeof hljs !== 'undefined') {
        try { highlighted = hljs.highlightAuto(text).value; } catch {}
      }
      const langLabel = lang ? lang.toUpperCase() : 'CODE';
      return '<div class="code-block-wrapper">' +
        '<div class="code-block-header"><span class="code-block-lang">' + langLabel + '</span>' +
        '<button class="code-copy-btn" onclick="copyCode(this)">复制</button></div>' +
        '<pre><code class="hljs">' + highlighted + '</code></pre></div>';
    };
    marked.setOptions({
      renderer: renderer,
      breaks: true,
      gfm: true
    });
  }

  // 复制代码
  window.copyCode = function(btn) {
    const code = btn.closest('.code-block-wrapper').querySelector('code').textContent;
    navigator.clipboard.writeText(code).then(() => {
      btn.textContent = '已复制';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('copied'); }, 2000);
    });
  };

  // ===== 移动端侧边栏 =====
  window.toggleSidebar = function() {
    $('sidebar').classList.toggle('open');
    $('sidebarBackdrop').classList.toggle('open');
  };

  // ===== API =====
  async function api(path, method, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const resp = await fetch(BASE_PATH + path, opts);
    return resp.json();
  }

  async function loadAgents() {
    try {
      agents = await api('/api/agents', 'GET');
      if (!Array.isArray(agents)) agents = [];
    } catch { agents = []; }
    renderAgentList();
  }

  async function loadTools() {
    try {
      allTools = await api('/api/tools', 'GET');
      if (!Array.isArray(allTools)) allTools = [];
    } catch { allTools = []; }
  }

  // ===== Agent 列表渲染 =====
  function renderAgentList() {
    if (agents.length === 0) {
      agentList.innerHTML = '<div class="empty-hint"><div class="empty-icon">🤖</div>暂无 Agent<br>点击上方 + 创建一个</div>';
      return;
    }
    agentList.innerHTML = agents.map(a => `
      <div class="agent-item ${a.id === currentAgentId ? 'active' : ''}" onclick="selectAgent('${a.id}')">
        <div class="agent-icon">${getAgentEmoji(a.name || a.id)}</div>
        <div class="agent-item-info">
          <div class="agent-name">${esc(a.name || a.id)}</div>
          <div class="agent-model">${esc(a.model || '默认模型')}</div>
        </div>
        <div class="agent-item-actions">
          <button class="btn-sm" onclick="event.stopPropagation();openEditModal('${a.id}')" title="编辑">✏️</button>
        </div>
      </div>
    `).join('');
  }

  function getAgentEmoji(name) {
    const n = name.toLowerCase();
    if (n.includes('code') || n.includes('dev') || n.includes('程序')) return '👨‍💻';
    if (n.includes('translate') || n.includes('翻译')) return '🌍';
    if (n.includes('write') || n.includes('写作')) return '✍️';
    if (n.includes('math') || n.includes('数学') || n.includes('calc')) return '🧮';
    if (n.includes('search') || n.includes('搜索')) return '🔍';
    if (n.includes('chat') || n.includes('聊天')) return '💬';
    return '🤖';
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function timeNow() {
    return new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }

  // ===== 选择 Agent =====
  window.selectAgent = function(id) {
    if (currentAgentId === id) return;
    currentAgentId = id;
    const ag = agents.find(a => a.id === id);
    headerTitle.textContent = ag ? ag.name || ag.id : 'MyClaw AI';
    noAgent.style.display = 'none';
    chat.style.display = 'flex';
    chat.innerHTML = '';
    inputArea.style.display = 'block';
    renderAgentList();
    clearTimeout(reconnectTimer);
    intentionalClose = true;
    connectWS(id);
    intentionalClose = false;
    // 移动端自动关闭侧边栏
    if (window.innerWidth <= 768) {
      $('sidebar').classList.remove('open');
      $('sidebarBackdrop').classList.remove('open');
    }
  };

  // ===== WebSocket =====
  function connectWS(agentId) {
    if (ws) { ws.onclose = null; ws.close(); ws = null; }
    clearTimeout(reconnectTimer);
    statusDot.classList.remove('connected');
    statusText.textContent = '连接中...';
    busy = false;
    sendBtn.disabled = false;
    removeThinking();

    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(proto + '//' + location.host + BASE_PATH + '/ws?agent=' + encodeURIComponent(agentId));

    ws.onopen = () => {
      statusDot.classList.add('connected');
      statusText.textContent = '已连接';
      reconnectAttempt = 0;
    };
    ws.onclose = () => {
      statusDot.classList.remove("connected");
      busy = false;
      sendBtn.disabled = false;
      removeThinking();
      if (intentionalClose) { intentionalClose = false; return; }
      var delay = Math.min(30000, 1000 * Math.pow(2, reconnectAttempt));
      reconnectAttempt++;
      statusText.textContent = '已断开，' + (delay / 1000) + 's 后重连...';
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(function() { if (currentAgentId) connectWS(currentAgentId); }, delay);
    };
    ws.onerror = () => {
      statusDot.classList.remove('connected');
      statusText.textContent = '连接错误';
    };
    ws.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      handleEvent(msg);
    };
  }

  function handleEvent(ev) {
    switch (ev.type) {
      case 'thinking':
        showThinking(); break;
      case 'tool_call':
        removeThinking();
        endStreamBubble();
        addToolCard('call', ev.name, ev.args);
        showThinking(); break;
      case 'tool_result':
        removeThinking();
        addToolCard('result', ev.name, ev.result);
        showThinking(); break;
      case 'stream':
        removeThinking();
        appendStream(ev.content);
        break;
      case 'stream_end':
        removeThinking();
        endStreamBubble();
        busy = false; sendBtn.disabled = false; input.focus(); break;
      case 'assistant':
        removeThinking();
        endStreamBubble();
        addMessage('assistant', ev.content);
        busy = false; sendBtn.disabled = false; input.focus(); break;
      case 'error':
        removeThinking();
        endStreamBubble();
        addMessage('error', ev.content);
        busy = false; sendBtn.disabled = false; input.focus(); break;
    }
  }

  // 流式输出：逐步追加内容到当前气泡
  function appendStream(text) {
    if (!streamingBubble) {
      // 创建新的 assistant 消息气泡
      const wrapper = document.createElement('div');
      wrapper.className = 'msg-wrapper assistant';
      const avatar = document.createElement('div');
      avatar.className = 'msg-avatar';
      avatar.textContent = '✨';
      const content = document.createElement('div');
      content.className = 'msg-content';
      const header = document.createElement('div');
      header.className = 'msg-header';
      header.innerHTML = '<span class="msg-name">AI</span><span class="msg-time">' + timeNow() + '</span>';
      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble md-rendered';
      content.appendChild(header);
      content.appendChild(bubble);
      wrapper.appendChild(avatar);
      wrapper.appendChild(content);
      chat.appendChild(wrapper);
      streamingBubble = bubble;
      streamContent = '';
    }
    streamContent += text;
    if (typeof marked !== 'undefined') {
      streamingBubble.innerHTML = marked.parse(streamContent);
    } else {
      streamingBubble.textContent = streamContent;
    }
    chat.scrollTop = chat.scrollHeight;
  }

  function endStreamBubble() {
    if (streamingBubble) {
      // 最终渲染一次，确保 markdown 完整
      if (typeof marked !== 'undefined' && streamContent) {
        streamingBubble.innerHTML = marked.parse(streamContent);
      }
      streamingBubble = null;
      streamContent = '';
    }
  }

  function addMessage(type, text) {
    const names = { user: 'You', assistant: 'AI', error: '错误' };
    const avatars = { user: '👤', assistant: '✨', error: '⚠️' };
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper ' + type;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = avatars[type] || '💬';

    const content = document.createElement('div');
    content.className = 'msg-content';

    const header = document.createElement('div');
    header.className = 'msg-header';
    header.innerHTML = '<span class="msg-name">' + esc(names[type] || type) + '</span>' +
                       '<span class="msg-time">' + timeNow() + '</span>';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';

    if (type === 'assistant' && typeof marked !== 'undefined') {
      bubble.classList.add('md-rendered');
      bubble.innerHTML = marked.parse(text);
    } else {
      bubble.textContent = text;
      if (type === 'user') bubble.style.whiteSpace = 'pre-wrap';
    }

    content.appendChild(header);
    content.appendChild(bubble);
    wrapper.appendChild(avatar);
    wrapper.appendChild(content);
    chat.appendChild(wrapper);
    chat.scrollTop = chat.scrollHeight;
  }

  function addToolCard(kind, name, detail) {
    const card = document.createElement('div');
    card.className = 'tool-card';
    const icon = kind === 'call' ? '🔧' : '📋';
    const label = kind === 'call' ? '调用工具' : '工具返回';
    card.innerHTML =
      '<details class="tool-detail">' +
        '<summary>' +
          '<span class="tool-icon">' + icon + '</span>' +
          '<span class="tool-name">' + esc(name) + '</span>' +
          '<span style="color:var(--text-muted);font-size:12px;margin-left:4px;">— ' + label + '</span>' +
          '<span class="tool-arrow">▶</span>' +
        '</summary>' +
        '<div class="tool-detail-body">' + esc(detail) + '</div>' +
      '</details>';
    chat.appendChild(card);
    chat.scrollTop = chat.scrollHeight;
  }

  function showThinking() {
    if (thinking) return;
    thinking = document.createElement('div');
    thinking.className = 'thinking';
    thinking.innerHTML =
      '<div class="thinking-avatar">✨</div>' +
      '<div class="thinking-content"><div class="dot-pulse"><span></span><span></span><span></span></div> 思考中...</div>';
    chat.appendChild(thinking);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeThinking() {
    if (thinking) { thinking.remove(); thinking = null; }
  }

  window.send = function() {
    const text = input.value.trim();
    if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
    addMessage('user', text);
    ws.send(JSON.stringify({ type: 'message', content: text }));
    input.value = '';
    input.style.height = 'auto';
    busy = true;
    sendBtn.disabled = true;
  };

  window.clearChat = function() {
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: 'clear' }));
    chat.innerHTML = '';
  };

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.send(); }
  });
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  // ===== 模态框 =====
  function populateToolSelect(selected) {
    const sel = $('fTools');
    sel.innerHTML = allTools.map(t =>
      `<option value="${esc(t)}" ${selected && selected.includes(t) ? 'selected' : ''}>${esc(t)}</option>`
    ).join('');
  }

  window.openCreateModal = function() {
    editingId = null;
    $('modalTitle').textContent = '新建 Agent';
    $('modalIcon').textContent = '➕';
    $('fId').value = '';
    $('fId').disabled = false;
    $('fName').value = '';
    $('fModel').value = '';
    $('fPrompt').value = '';
    $('fMaxTurns').value = '10';
    $('btnSave').textContent = '创建';
    $('btnDelete').style.display = 'none';
    populateToolSelect(null);
    $('agentModal').classList.add('open');
  };

  window.openEditModal = function(id) {
    const ag = agents.find(a => a.id === id);
    if (!ag) return;
    editingId = id;
    $('modalTitle').textContent = '编辑 Agent';
    $('modalIcon').textContent = '✏️';
    $('fId').value = ag.id;
    $('fId').disabled = true;
    $('fName').value = ag.name || '';
    $('fModel').value = ag.model || '';
    $('fPrompt').value = ag.system_prompt || '';
    $('fMaxTurns').value = ag.max_turns || 10;
    $('btnSave').textContent = '保存';
    $('btnDelete').style.display = 'inline-block';
    populateToolSelect(ag.tools);
    $('agentModal').classList.add('open');
  };

  window.closeModal = function() {
    $('agentModal').classList.remove('open');
  };

  // 点击遮罩关闭模态框
  $('agentModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  window.saveAgent = async function() {
    const id = $('fId').value.trim();
    const name = $('fName').value.trim();
    const model = $('fModel').value.trim();
    const prompt = $('fPrompt').value.trim();
    const maxTurns = parseInt($('fMaxTurns').value) || 10;
    const toolSel = $('fTools');
    const tools = Array.from(toolSel.selectedOptions).map(o => o.value);

    if (!id) { alert('请输入 Agent ID'); return; }

    const body = { id, name: name || id, model, system_prompt: prompt, max_turns: maxTurns, tools };

    try {
      if (editingId) {
        await api('/api/agents/' + encodeURIComponent(editingId), 'PUT', body);
      } else {
        const resp = await api('/api/agents', 'POST', body);
        if (resp.error) { alert(resp.error); return; }
      }
      closeModal();
      await loadAgents();
      if (editingId && editingId === currentAgentId) {
        selectAgent(editingId);
      }
    } catch (e) {
      alert('保存失败: ' + e.message);
    }
  };

  window.deleteAgent = async function() {
    if (!editingId) return;
    if (!confirm('确定要删除 Agent "' + editingId + '" 吗？')) return;
    try {
      await api('/api/agents/' + encodeURIComponent(editingId), 'DELETE');
      closeModal();
      if (currentAgentId === editingId) {
        currentAgentId = null;
        if (ws) { ws.onclose = null; ws.close(); ws = null; }
        headerTitle.textContent = 'MyClaw AI';
        chat.style.display = 'none';
        inputArea.style.display = 'none';
        noAgent.style.display = 'flex';
        statusDot.classList.remove('connected');
        statusText.textContent = '未连接';
      }
      await loadAgents();
    } catch (e) {
      alert('删除失败: ' + e.message);
    }
  };

  // ===== 初始化 =====
  async function init() {
    await loadTools();
    await loadAgents();
  }
  init();
})();
</script>
</body>
</html>
